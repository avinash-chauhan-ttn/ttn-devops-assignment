name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run website tests
        run: npm test

  build:
    name: Build / Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package static site
        run: npm run build
      - name: Upload website package
        uses: actions/upload-artifact@v4
        with:
          name: website-package
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download website package
        uses: actions/download-artifact@v4
        with:
          name: website-package
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy website to S3
        id: deploy
        run: |
          set -euo pipefail

          run_aws() {
            local label="$1"
            shift
            echo "=== ${label} ==="
            local output
            if ! output=$("$@" 2>&1); then
              echo "$output"
              echo "::error::${label} failed: ${output}"
              exit 1
            fi
            echo "$output"
          }

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ttn-devops-assignment-${ACCOUNT_ID}"
          URL="http://${BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"
          echo "Account ${ACCOUNT_ID}, bucket ${BUCKET}"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            # us-east-1 rejects LocationConstraint; do not pass --region here.
            run_aws "Create bucket" aws s3api create-bucket --bucket "$BUCKET"
          fi

          run_aws "Allow public access" aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"

          run_aws "Enable website hosting" aws s3api put-bucket-website \
            --bucket "$BUCKET" \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}'

          run_aws "Set public read policy" aws s3api put-bucket-policy --bucket "$BUCKET" --policy "{
            \"Version\": \"2012-10-17\",
            \"Statement\": [{
              \"Sid\": \"PublicReadGetObject\",
              \"Effect\": \"Allow\",
              \"Principal\": \"*\",
              \"Action\": \"s3:GetObject\",
              \"Resource\": \"arn:aws:s3:::${BUCKET}/*\"
            }]
          }"

          run_aws "Upload website files" aws s3 sync dist/ "s3://${BUCKET}" --delete --cache-control "max-age=60,public"

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Website URL::${URL}"
          echo "Website URL: ${URL}"
      - name: Publish website URL
        run: |
          echo "## Deployed website" >> "$GITHUB_STEP_SUMMARY"
          echo "S3 website URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
