name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run website tests
        run: npm test

  build:
    name: Build / Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package static site
        run: npm run build
      - name: Upload website package
        uses: actions/upload-artifact@v4
        with:
          name: website-package
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download website package
        uses: actions/download-artifact@v4
        with:
          name: website-package
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy website to S3
        id: deploy
        env:
          AWS_PAGER: ""
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="ttn-devops-assignment-${ACCOUNT_ID}"
          REST_URL="https://${BUCKET}.s3.${AWS_REGION}.amazonaws.com/index.html"
          SITE_URL="http://${BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"
          echo "Account ${ACCOUNT_ID}"
          echo "Bucket ${BUCKET}"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET"
          fi

          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"

          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "{
            \"Version\": \"2012-10-17\",
            \"Statement\": [{
              \"Sid\": \"PublicReadGetObject\",
              \"Effect\": \"Allow\",
              \"Principal\": \"*\",
              \"Action\": \"s3:GetObject\",
              \"Resource\": \"arn:aws:s3:::${BUCKET}/*\"
            }]
          }"

          aws s3 website "s3://${BUCKET}/" --index-document index.html --error-document index.html || echo "::warning::S3 website hosting could not be enabled; using the object URL instead."

          aws s3 sync dist/ "s3://${BUCKET}" --delete --cache-control "max-age=60,public" --acl public-read || aws s3 sync dist/ "s3://${BUCKET}" --delete --cache-control "max-age=60,public"

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "rest_url=${REST_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice title=S3 website URL::${SITE_URL}"
          echo "::notice title=S3 object URL::${REST_URL}"
          echo "S3 website URL: ${SITE_URL}"
          echo "S3 object URL: ${REST_URL}"
      - name: Publish website URL
        run: |
          echo "## Deployed website" >> "$GITHUB_STEP_SUMMARY"
          echo "S3 website URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "S3 object URL: ${{ steps.deploy.outputs.rest_url }}" >> "$GITHUB_STEP_SUMMARY"
